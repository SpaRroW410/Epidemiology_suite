# The GitHub Pages site (docs/ROADMAP.md items 15 and 17): the pkgdown documentation, with one page per
# calculator generated from the package's own content objects (tools/docs/build_site_sources.R), and the app
# itself as a Shinylive (WebAssembly) build under /app/, assembled from the package's R/ directory
# (tools/pages/make_app.R), so neither can drift from the package. Every push builds both and keeps the site
# as an artifact; the site is published to GitHub Pages only from `main`. One-time setup by the repository
# owner: Settings > Pages > Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "tests/**"
      - "tools/webr-spike/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # The app in the browser: export with shinylive, then open it in headless Chrome from the /app/ subpath it will
    # be served from and require that the UI comes up, a calculator renders and no source file fails to load.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install shinylive (R package)
        run: Rscript -e 'install.packages("shinylive")'
      - name: Assemble the app directory from the package sources
        run: Rscript tools/pages/make_app.R pages_app
      - name: Export (downloads the webR runtime and the WebAssembly packages)
        run: |
          Rscript -e 'cat("shinylive", as.character(packageVersion("shinylive")), "\n"); shinylive::export("pages_app", "app_out/app")' 2>&1 | tee export.log
          du -sh app_out/app
      - name: Boot the exported site in Chrome
        run: |
          (cd app_out && python3 -m http.server 8008 >/dev/null 2>&1 &)
          sleep 3
          cd tools/webr-spike
          npm init -y >/dev/null && npm install playwright-core >/dev/null
          node boot_test.mjs http://localhost:8008/app/ "$GITHUB_WORKSPACE/boot.png" "$GITHUB_WORKSPACE/boot.json"
      - name: Check the boot report
        run: tools/pages/check_boot.sh boot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-boot
          path: |
            export.log
            boot.png
            boot.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-site
          path: app_out/app
          retention-days: 14

  build:
    # The documentation is built and published even when the app job fails (the app artifact is only uploaded
    # after its browser check passes, so a broken app is never published; the red job shows the problem).
    needs: app
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The package's hard dependencies (not Suggests: the oracle packages are only needed by the tests),
      # plus pkgdown and what it and the generator need.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgdown, any::pkgload, any::rmarkdown, any::knitr, local::.
          needs: website

      - name: Generate the calculator pages and _pkgdown.yml
        run: Rscript tools/docs/build_site_sources.R

      - name: Build the site
        run: Rscript -e 'pkgdown::build_site(preview = FALSE, install = FALSE, new_process = FALSE)'

      - name: Add the browser build of the app under /app/
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-site
          path: site_out/app

      - name: Keep the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site_out
          retention-days: 14

      - name: Package the site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
