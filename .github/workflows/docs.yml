# Documentation site (docs/ROADMAP.md item 17): pkgdown, with one page per calculator generated from the
# package's own content objects (tools/docs/build_site_sources.R), so the site cannot drift from the app.
# Every push builds the site and keeps it as an artifact; the site is published to GitHub Pages only from
# `main`. One-time setup by the repository owner: Settings > Pages > Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "tests/**"
      - "tools/webr-spike/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The package's hard dependencies (not Suggests: the oracle packages are only needed by the tests),
      # plus pkgdown and what it and the generator need.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgdown, any::pkgload, any::rmarkdown, any::knitr, local::.
          needs: website

      - name: Generate the calculator pages and _pkgdown.yml
        run: Rscript tools/docs/build_site_sources.R

      - name: Build the site
        run: Rscript -e 'pkgdown::build_site(preview = FALSE, install = FALSE, new_process = FALSE)'

      - name: Keep the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site_out
          retention-days: 14

      - name: Package the site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
