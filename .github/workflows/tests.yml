# Unit tests (docs/ROADMAP.md, P0 items 4-6).
# - Every push / pull request: the fast suite (slow Monte Carlo tests skipped).
# - Weekly, or on demand from the Actions tab: the full suite, S2R_SLOW_TESTS=true.
# Packages are restored from renv.lock so CI runs the same versions as the
# development environment.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow Monte Carlo tests"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      S2R_SLOW_TESTS: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
