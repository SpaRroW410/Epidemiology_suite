<!-- Status overlay for the browser build (injected into the exported index.html by tools/pages/inject_status.py).
     Shinylive shows only a spinner while it downloads about 60 MB, starts R and builds the page; on a phone that can take minutes,
     and when something goes wrong it stays a spinner. This explains what is happening, keeps a small log, and tells people what to
     try. It removes itself when the app is on screen. -->
<style>
  #s2r-status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483647; font: 13px/1.45 system-ui, sans-serif;
    background: #1f2933; color: #f5f7fa; padding: 10px 14px; box-shadow: 0 -2px 8px rgba(0,0,0,.35); }
  #s2r-status b { color: #fff; } #s2r-status a { color: #8ecbff; }
  #s2r-status summary { cursor: pointer; color: #9fb3c8; margin-top: 4px; }
  #s2r-status pre { white-space: pre-wrap; word-break: break-word; max-height: 32vh; overflow: auto; margin: 6px 0 0; font-size: 11px; color: #cbd2d9; }
  #s2r-status button { margin-top: 6px; font: inherit; padding: 4px 10px; border-radius: 4px; border: 1px solid #52606d; background: #323f4b; color: #fff; }
  #s2r-bar { height: 3px; background: #52606d; margin: 6px 0; overflow: hidden; }
  #s2r-bar i { display: block; height: 100%; width: 35%; background: #4aa3ff; animation: s2r-run 1.4s ease-in-out infinite; }
  @keyframes s2r-run { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #s2r-bar i { animation: none; width: 100%; } }
</style>
<div id="s2r-status" role="status" aria-live="polite">
  <div><b>epidemiologicasuite is starting.</b> <span id="s2r-msg"></span></div>
  <div id="s2r-bar"><i></i></div>
  <details><summary>Details</summary><pre id="s2r-log"></pre><button type="button" id="s2r-copy">Copy details</button></details>
</div>
<noscript>This app needs JavaScript. The R package runs without a browser: see the install instructions on the project page.</noscript>
<script>
(function () {
  var MOBILE_URL = "__MOBILE_URL__";
  var t0 = Date.now(), lines = [];
  var box = document.getElementById("s2r-status"), msg = document.getElementById("s2r-msg"), pre = document.getElementById("s2r-log");
  function secs() { return Math.round((Date.now() - t0) / 1000); }
  function add(s) { lines.push(secs() + " s  " + s); if (lines.length > 60) lines.shift(); pre.textContent = lines.join("\n"); }
  document.title = "Epidemiological suite";
  add("page " + location.pathname);
  add("browser: " + navigator.userAgent);
  add("WebAssembly: " + (typeof WebAssembly) + "; service workers: " + ("serviceWorker" in navigator) + "; SharedArrayBuffer: " + (typeof SharedArrayBuffer) +
      "; crossOriginIsolated: " + window.crossOriginIsolated + "; device memory (GB): " + (navigator.deviceMemory || "n/a"));
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (r) { add("service worker registrations: " + r.length); });
  window.addEventListener("error", function (e) { add("error: " + e.message); });
  window.addEventListener("unhandledrejection", function (e) { add("rejection: " + (e.reason && e.reason.message || e.reason)); });
  ["error", "warn"].forEach(function (k) {
    var o = console[k]; console[k] = function () {
      try { var t = Array.prototype.join.call(arguments, " "); if (!/Downloading webR package|Requested package rootSolve/.test(t)) add(k + ": " + t.slice(0, 200)); } catch (e) {}
      return o.apply(console, arguments);
    };
  });
  // a tab that the phone kills for memory reloads by itself: count consecutive starts that never finished
  var tries = 1;
  try { tries = (Number(sessionStorage.getItem("s2r-tries")) || 0) + 1; sessionStorage.setItem("s2r-tries", String(tries)); } catch (e) {}
  if (tries > 2) add("this page has now been started " + tries + " times in this tab without finishing (the browser may be stopping it for lack of memory)");
  function done() { clearInterval(iv); try { sessionStorage.removeItem("s2r-tries"); } catch (e) {} box.parentNode.removeChild(box); }
  var iv = setInterval(function () {
    var s = secs(), ready = false;
    try {
      var f = document.querySelector("iframe"), d = f && f.contentDocument;
      ready = !!(d && d.querySelector(".navbar, nav.navbar, .bslib-page-navbar"));
    } catch (e) {}
    if (ready) return done();
    if (s < 20) msg.textContent = "First visit: about 60 MB is downloaded and R is started in your browser. Nothing is sent anywhere.";
    else if (s < 150) msg.textContent = "Still starting (" + s + " s). On a phone the first visit can take two to five minutes; later visits are faster.";
    else msg.innerHTML = "Still starting (" + s + " s). If this never finishes: close other tabs and apps, turn off Private browsing / Lockdown mode, " +
      "or open the page on a computer. The app needs about 1 GB of free memory. " +
      (MOBILE_URL ? "<a href=\"" + MOBILE_URL + "\">Open the phone version</a> (runs on a server, nothing to download). " : "") +
      "The R package runs without a browser (install instructions on the <a href=\"../\">project page</a>). Open <i>Details</i> and send them if you report this.";
  }, 1000);
  document.getElementById("s2r-copy").onclick = function () {
    var text = lines.join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { add("copied"); }, function () { add("copy not allowed; select the text instead"); });
  };
})();
</script>
