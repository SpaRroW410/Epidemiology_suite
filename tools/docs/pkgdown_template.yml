# Base of _pkgdown.yml; tools/docs/build_site_sources.R appends the generated `articles:` section and writes
# the result to _pkgdown.yml (which is not committed).
url: https://sparrow410.github.io/Epidemiology_suite/

# not `docs/`, which holds the project's markdown documents
destination: site_out

template:
  bootstrap: 5
  bootswatch: litera
  math-rendering: mathjax

navbar:
  structure:
    left: [app, calculators, project, reference]
    right: [search, github]
  components:
    app:
      text: Open the app
      href: app/
    calculators:
      text: Calculators
      href: articles/calculators.html
    project:
      text: Project
      menu:
        - text: Roadmap and decisions
          href: articles/roadmap.html
        - text: Software design
          href: articles/design.html
        - text: Study-design algorithm
          href: articles/algorithm.html
    reference:
      text: R functions
      href: reference/index.html

reference:
  - title: Run the app
    contents:
      - run_app
      - epidemiologysuite_app
  - title: Find a calculator
    contents:
      - ss_find
      - ss_find_addin
  - title: Calculation functions
    desc: >
      Every calculation of the app as a function, for scripts, Quarto and R Markdown. Each returns a list of class
      `ss_result` and has a worked example taken from the tests (checked against a published value, a package or a simulation).
    contents:
      - starts_with("calc_")
